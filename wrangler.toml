name = "neon-store"
main = "src/worker.js"
compatibility_date = "2026-01-15"

# Static files (the Mini App) are served for free. Only /api and /telegram run the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/telegram/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "neon-p2p"
# No database_id: Cloudflare creates the database on the first deploy and remembers it.
migrations_dir = "migrations"

# Customer receipts are kept in Telegram, not in Cloudflare storage (no card needed). The Worker sends each image silently
# to a private chat and reads it back when an admin opens the order. By default that chat is the first owner's private
# chat with the bot (the owner must press Start once). To use a private channel or group instead, add the bot as an admin
# there and set PROOF_CHAT_ID below.

# Every 5 minutes: expire unpaid orders, re-send alerts that did not reach anyone, forget old proofs.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# PROOF_CHAT_ID = "-1001234567890"
# Optional. The Worker works out its own address; only set this if you attach a custom domain (https, no trailing slash).
# WEBAPP_URL = "https://shop.example.com"
# Telegram numeric ids of the OWNERS (comma separated). Owners can do everything. They can add staff inside the app.
ADMIN_IDS = "5356910725,8373718510"
# Optional. Normally leave this out: alerts go to each admin privately, or to a group after an owner sends /alerts there.
# ADMIN_CHAT_ID = "-100123456789"
# Public support username shown in the app, without @.
SUPPORT_USERNAME = "Neon_ghost147"
AUTH_MAX_AGE_SEC = "86400"

# Secrets (never put these in this file). Set them once with:
#   wrangler secret put BOT_TOKEN
# Only BOT_TOKEN is needed. The webhook secret is derived from it, and the Worker repairs its own webhook every 5 minutes.
